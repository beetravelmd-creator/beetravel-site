<!DOCTYPE html>
<html lang="ro">
  <head><meta charset="utf-8" />
<meta property="og:image" content="https://beetravel.md/.netlify/og-image/a082030cdb644aff79466925406bd6fe.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<title>Formulare Bee Travel</title></head>
  <body>
    <!-- Fișier folosit exclusiv de Netlify pentru detectarea formularelor la build. Nu este afișat vizitatorilor. -->

    <form name="tur-personalizat" data-netlify="true" netlify-honeypot="bot-field" hidden method="POST" >
      <input type="hidden" name="form-name" value="tur-personalizat" />
      <input name="bot-field" />
      <input name="nume" />
      <input name="telefon" />
      <input name="whatsapp" />
      <input name="email" />
      <input name="persoane" />
      <input name="data" />
      <input name="durata" />
      <input name="destinatii" />
      <input name="tip_experienta" />
      <textarea name="mesaj"></textarea>
      <input name="consent_privacy" />
    </form>

    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden method="POST" >
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="nume" />
      <input name="telefon" />
      <input name="email" />
      <textarea name="mesaj"></textarea>
      <input name="consent_privacy" />
    </form>

    <form name="rezerva-tur" data-netlify="true" netlify-honeypot="bot-field" action="/multumim-rezervare/" hidden method="POST" >
      <input type="hidden" name="form-name" value="rezerva-tur" />
      <input name="bot-field" />
      <input name="nume" />
      <input name="telefon" />
      <input name="whatsapp" />
      <input name="email" />
      <input name="traseu" />
      <input name="persoane" />
      <input name="transport" />
      <input name="data" />
      <input name="limba" />
      <input name="preluare" />
      <textarea name="mesaj"></textarea>
      <input name="accept_terms" />
      <input name="consent_privacy" />
    </form>
  <form name="recenzii-notificari" data-netlify="true" netlify-honeypot="bot-field" hidden method="POST" >
<input type="hidden" name="form-name" value="recenzii-notificari" /><input name="bot-field" />
<input name="review_id" /><input name="nume" /><input name="email" /><input name="nota" /><input name="tur" /><textarea name="mesaj"></textarea>
</form>
</body>
</html>
