[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Panoul de administrare nu se indexează în Google
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/administrare-recenzii/*"
  [headers.values]
    X-Robots-Tag = "noindex"
